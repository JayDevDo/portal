<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JayVanDo.com</title>
	<link rel="stylesheet" type="text/css" href="mainpage.css">
</head>
<body>
	<canvas id="portalCanvas" aria-label="JayVanDo.com portal with links to FPL, WSL, JSD, JSD-AI and SVG-DARTBOARD"></canvas>
	<div id="pageloc"></div>

	<script>
		const canvas = document.getElementById("portalCanvas");
		const ctx = canvas.getContext("2d");
		const pageHost = location.hostname;
		const servedGh = pageHost === "jaydevdo.github.io";
		const sites = [
			{name: "FPL", repo: "FPL", homeX: 0.17, homeY: 0.20, color: [128, 0, 128]},
			{name: "WSL", repo: "WSL", homeX: 0.50, homeY: 0.18, color: [0, 128, 0]},
			{name: "JSD", repo: "JSD", homeX: 0.83, homeY: 0.23, color: [0, 0, 139]},
			{name: "JSD-AI", repo: "JSD-AI", homeX: 0.27, homeY: 0.73, color: [0, 255, 255]},
			{name: "SVG-DARTBOARD", repo: "SVG-DARTBOARD", homeX: 0.73, homeY: 0.72, color: [255, 0, 0]}
		];
		// slow: const title = {text: "JayVanDo.com", x: 0, y: 0, vx: 57.75, vy: 42.9, width: 0, height: 0, fontSize: 48, color: [245, 243, 124]};
		// medium: const title = {text: "JayVanDo.com", x: 0, y: 0, vx: 72.2, vy: 53.6, width: 0, height: 0, fontSize: 48, color: [245, 243, 124]}; 
		// fast: const title = {text: "JayVanDo.com", x: 0, y: 0, vx: 86.6, vy: 64.4, width: 0, height: 0, fontSize: 48, color: [245, 243, 124]};
		const title = {text: "JayVanDo.com", x: 0, y: 0, vx: 72.2, vy: 53.6, width: 0, height: 0, fontSize: 48, color: [245, 243, 124]};
		let width = 0;
		let height = 0;
		let dialRadius = 66.7;
		let hoveredDial = -1;
		let lastTime = 0;
		let started = false;
		let boundaryEdges = [];

		function siteUrl(site){ return servedGh ? `https://jaydevdo.github.io/${site.repo}/index.html` : `${location.origin}/MSI-LT-local/${site.repo}/index.html`; }

		function buildBoundary(){
			const cut = Math.min(width, height) * 0.20;
			const cutX = cut;
			const cutY = cut;

			const points = [
				{x: cutX, y: 0},
				{x: width - cutX, y: 0},
				{x: width, y: cutY},
				{x: width, y: height - cutY},
				{x: width - cutX, y: height},
				{x: cutX, y: height},
				{x: 0, y: height - cutY},
				{x: 0, y: cutY}
			];

			boundaryEdges = [];

			for(let i = 0; i < points.length; i++){
				const a = points[i];
				const b = points[(i + 1) % points.length];
				const dx = b.x - a.x;
				const dy = b.y - a.y;
				const edgeLength = Math.hypot(dx, dy);
				const nx = -dy / edgeLength;
				const ny = dx / edgeLength;

				boundaryEdges.push({
					nx: nx,
					ny: ny,
					c: nx * a.x + ny * a.y
				});
			}
		}

		function dialEdgeClearance(site, edge){
			const bottomMargin = Math.max(0, -edge.ny) * 24;
			return edge.nx * site.x + edge.ny * site.y - edge.c - dialRadius - bottomMargin;
		}

		function dialPositionInside(x, y){
			return boundaryEdges.every(edge => {
				const bottomMargin = Math.max(0, -edge.ny) * 24;
				return edge.nx * x + edge.ny * y >= edge.c + dialRadius + bottomMargin;
			});
		}

		function constrainDial(site, reflect){
			let edgeHit = false;
			for(let pass = 0; pass < 2; pass++){
				for(let edge of boundaryEdges){
					const bottomMargin = Math.max(0, -edge.ny) * 24;
					const required = edge.c + dialRadius + bottomMargin;
					const current = edge.nx * site.x + edge.ny * site.y;
					const penetration = required - current;
					if(penetration <= 0) continue;

					site.x += edge.nx * penetration;
					site.y += edge.ny * penetration;
					edgeHit = true;

					if(reflect){
						const towardOutside = site.vx * edge.nx + site.vy * edge.ny;
						if(towardOutside < 0){
							site.vx -= 2 * towardOutside * edge.nx;
							site.vy -= 2 * towardOutside * edge.ny;
						}
					}
				}
			}
			return edgeHit;
		}

		function constrainTitle(reflect){
			for(let pass = 0; pass < 2; pass++){
				for(let edge of boundaryEdges){
					const halfTextW = title.width / 2;
					const halfTextH = title.height / 2;
					const titleExtent = Math.abs(edge.nx) * halfTextW + Math.abs(edge.ny) * halfTextH;
					const margin = 12 + Math.max(0, -edge.ny) * 22;
					const required = edge.c + titleExtent + margin;
					const current = edge.nx * title.x + edge.ny * title.y;
					const penetration = required - current;
					if(penetration <= 0) continue;

					title.x += edge.nx * penetration;
					title.y += edge.ny * penetration;

					if(reflect){
						const towardOutside = title.vx * edge.nx + title.vy * edge.ny;
						if(towardOutside < 0){
							title.vx -= 2 * towardOutside * edge.nx;
							title.vy -= 2 * towardOutside * edge.ny;
						}
					}
				}
			}
		}

		function resizeCanvas(){
			const oldWidth = width || innerWidth;
			const oldHeight = height || innerHeight;
			const dpr = Math.max(1, window.devicePixelRatio || 1);
			width = Math.max(320, innerWidth);
			height = Math.max(320, innerHeight);
			canvas.width = Math.round(width * dpr);
			canvas.height = Math.round(height * dpr);
			canvas.style.width = `${width}px`;
			canvas.style.height = `${height}px`;
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			// medium: dialRadius = Math.max(48.3, Math.min(73.6, Math.min(width, height) * 0.08625));
			dialRadius = Math.max(55.5, Math.min(84.6, Math.min(width, height) * 0.0992));
			title.fontSize = Math.max(30, Math.min(62, width * 0.055));
			ctx.font = `600 ${title.fontSize}px Arial, sans-serif`;
			title.width = ctx.measureText(title.text).width;
			title.height = title.fontSize * 0.95;
			buildBoundary();

			if(!started){
				title.x = width * 0.25;
				title.y = height * 0.48;
				sites.forEach(site => {
					site.x = width * site.homeX;
					site.y = height * site.homeY;
					site.vx = 0;
					site.vy = 0;
					site.edgeBounces = 3;
					site.motion = "rest";
					site.hitColor = site.color;
				});
				started = true;
			}else{
				title.x = title.x * width / oldWidth;
				title.y = title.y * height / oldHeight;
				sites.forEach(site => {
					site.x = site.x * width / oldWidth;
					site.y = site.y * height / oldHeight;
				});
			}

			constrainTitle(false);
			sites.forEach(site => { constrainDial(site, false); });
		}

		function update(dt){
			title.x += title.vx * dt;
			title.y += title.vy * dt;
			const halfTextW = title.width / 2;
			const halfTextH = title.height / 2;
			constrainTitle(true);

			const safeEdge = 34;
			sites.forEach(site => {
				if(site.motion === "rest"){ site.vx = 0; site.vy = 0; return; }

				if(site.motion === "settle"){
					let ax = 0;
					let ay = 0;
					for(let edge of boundaryEdges){
						const clearance = dialEdgeClearance(site, edge);
						if(clearance < safeEdge){
							const force = (safeEdge - clearance) * 5.5;
							ax += edge.nx * force;
							ay += edge.ny * force;
						}
					}
					site.vx += ax * dt;
					site.vy += ay * dt;
					const damping = Math.exp(-2.6 * dt);
					site.vx *= damping;
					site.vy *= damping;
				}

				site.x += site.vx * dt;
				site.y += site.vy * dt;
				const edgeHit = constrainDial(site, true);
				// if(edgeHit && site.motion === "active"){ site.edgeBounces++; if(site.edgeBounces >= 3) site.motion = "settle"; }
				if(edgeHit && site.motion === "active"){ site.edgeBounces++; if(site.edgeBounces >= 4) site.motion = "settle"; }


				if(site.motion === "settle"){
					const clearEdge = boundaryEdges.every(edge => dialEdgeClearance(site, edge) >= safeEdge - 2);
					if(clearEdge && Math.hypot(site.vx, site.vy) < 7){ site.vx = 0; site.vy = 0; site.motion = "rest"; }
				}
			});

			for(let i = 0; i < sites.length; i++){
				for(let j = i + 1; j < sites.length; j++){
					const a = sites[i];
					const b = sites[j];
					const dx = b.x - a.x;
					const dy = b.y - a.y;
					const dist = Math.max(0.001, Math.hypot(dx, dy));
					const minDist = dialRadius * 2 + 4;
					if(dist >= minDist) continue;
					const nx = dx / dist;
					const ny = dy / dist;
					const overlap = minDist - dist;
					a.x -= nx * overlap / 2;
					a.y -= ny * overlap / 2;
					b.x += nx * overlap / 2;
					b.y += ny * overlap / 2;
					constrainDial(a, false);
					constrainDial(b, false);
					const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
					if(rel < 0){
						const impulse = -rel * 0.88;
						a.vx -= nx * impulse;
						a.vy -= ny * impulse;
						b.vx += nx * impulse;
						b.vy += ny * impulse;
						if(a.motion === "rest" && Math.hypot(a.vx, a.vy) > 5){ a.motion = "active"; a.edgeBounces = 0; }
						if(b.motion === "rest" && Math.hypot(b.vx, b.vy) > 5){ b.motion = "active"; b.edgeBounces = 0; }
						a.hitColor = b.color;
						b.hitColor = a.color;
						a.edgeBounces = 0;
						b.edgeBounces = 0;
					}
				}
			}

			for(let pass = 0; pass < 2; pass++){
				for(let i = 0; i < sites.length; i++){
					const site = sites[i];
					const left = title.x - halfTextW;
					const right = title.x + halfTextW;
					const top = title.y - halfTextH;
					const bottom = title.y + halfTextH;
					const nearX = Math.max(left, Math.min(site.x, right));
					const nearY = Math.max(top, Math.min(site.y, bottom));
					let dx = site.x - nearX;
					let dy = site.y - nearY;
					let dist = Math.hypot(dx, dy);
					let nx = 0;
					let ny = 0;
					let overlap = 0;

					if(dist >= dialRadius) continue;
					if(dist > 0.001){
						nx = dx / dist;
						ny = dy / dist;
						overlap = dialRadius - dist;
					}else{
						const gaps = [site.x - left, right - site.x, site.y - top, bottom - site.y];
						const side = gaps.indexOf(Math.min(...gaps));
						if(side === 0){ nx = -1; overlap = dialRadius + gaps[0]; }
						if(side === 1){ nx = 1; overlap = dialRadius + gaps[1]; }
						if(side === 2){ ny = -1; overlap = dialRadius + gaps[2]; }
						if(side === 3){ ny = 1; overlap = dialRadius + gaps[3]; }
					}

					const moveX = site.x + nx * (overlap + 1);
					const moveY = site.y + ny * (overlap + 1);
					let canMove = dialPositionInside(moveX, moveY);
					if(canMove){
						for(let j = 0; j < sites.length; j++){
							if(j === i) continue;
							if(Math.hypot(moveX - sites[j].x, moveY - sites[j].y) < dialRadius * 2 + 2){ canMove = false; break; }
						}
					}

					const towardDial = title.vx * nx + title.vy * ny;
					/* sticky text 
					if(canMove){
						site.x = moveX;
						site.y = moveY;
						if(towardDial > 0){
							const impulse = Math.max(52, towardDial * 1.35);
							site.vx += nx * impulse + title.vx * 0.28;
							site.vy += ny * impulse + title.vy * 0.28;
							const speed = Math.hypot(site.vx, site.vy);
							if(speed > 190){ site.vx *= 190 / speed; site.vy *= 190 / speed; }
							site.edgeBounces = 0;
							site.motion = "active";
							site.hitColor = title.color;
						}
					*/
					if(canMove){
						site.x = moveX;
						site.y = moveY;
						if(towardDial > 0){
							const impulse = Math.max(52, towardDial * 1.35);
							site.vx += nx * impulse + title.vx * 0.28;
							site.vy += ny * impulse + title.vy * 0.28;

							title.vx -= 2 * towardDial * nx;
							title.vy -= 2 * towardDial * ny;

							const speed = Math.hypot(site.vx, site.vy);
							if(speed > 190){ site.vx *= 190 / speed; site.vy *= 190 / speed; }
							site.edgeBounces = 0;
							site.motion = "active";
							site.hitColor = title.color;
						}
					}else{
						if(towardDial > 0){ title.vx -= 2 * towardDial * nx; title.vy -= 2 * towardDial * ny; }
						title.x -= nx * (overlap + 1);
						title.y -= ny * (overlap + 1);
						constrainTitle(true);
					}
				}
			}
		}

		function draw(){
			ctx.clearRect(0, 0, width, height);
			ctx.fillStyle = "#000";
			ctx.fillRect(0, 0, width, height);

			const cut = Math.min(width, height) * 0.20;
			const cutX = cut;
			const cutY = cut;

			ctx.beginPath();
			ctx.moveTo(cutX, 0);
			ctx.lineTo(width - cutX, 0);
			ctx.lineTo(width, cutY);
			ctx.lineTo(width, height - cutY);
			ctx.lineTo(width - cutX, height);
			ctx.lineTo(cutX, height);
			ctx.lineTo(0, height - cutY);
			ctx.lineTo(0, cutY);
			ctx.closePath();

			ctx.lineWidth = 3;
			ctx.strokeStyle = "#f5f37c";
			ctx.stroke();

			ctx.font = `600 ${title.fontSize}px Arial, sans-serif`;
			ctx.textAlign = "center";
			ctx.textBaseline = "middle";
			ctx.fillStyle = `rgb(${title.color[0]}, ${title.color[1]}, ${title.color[2]})`;
			ctx.fillText(title.text, title.x, title.y);

			sites.forEach((site, idx) => {
				// const mix = Math.max(0, 1 - Math.min(3, site.edgeBounces) / 3);
				const recoveryBounces = Math.max(0, site.edgeBounces - 1);
				const mix = Math.max(0, 1 - Math.min(3, recoveryBounces) / 3);
				const r = Math.round(site.color[0] + (site.hitColor[0] - site.color[0]) * mix);
				const g = Math.round(site.color[1] + (site.hitColor[1] - site.color[1]) * mix);
				const b = Math.round(site.color[2] + (site.hitColor[2] - site.color[2]) * mix);
				const brightness = r * 0.299 + g * 0.587 + b * 0.114;

				ctx.beginPath();
				ctx.arc(site.x, site.y, dialRadius, 0, Math.PI * 2);
				ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
				ctx.fill();

				ctx.lineWidth = idx === hoveredDial ? 5 : 3;
				ctx.strokeStyle = idx === hoveredDial ? "#f5f37c" : "#111";
				ctx.stroke();

				ctx.fillStyle = brightness < 120 ? "#fff" : "#111";
				ctx.font = `600 ${site.name.length > 8 ? Math.max(12, dialRadius * 0.23) : Math.max(16, dialRadius * 0.34)}px Arial, sans-serif`;
				ctx.fillText(site.name, site.x, site.y);
			});
		}


		function animate(now){
			const dt = Math.min(0.033, Math.max(0, (now - lastTime) / 1000 || 0));
			lastTime = now;
			update(dt);
			draw();
			requestAnimationFrame(animate);
		}

		canvas.addEventListener("pointermove", event => {
			const rect = canvas.getBoundingClientRect();
			const x = event.clientX - rect.left;
			const y = event.clientY - rect.top;
			hoveredDial = sites.findIndex(site => Math.hypot(x - site.x, y - site.y) <= dialRadius);
			canvas.style.cursor = hoveredDial >= 0 ? "pointer" : "default";
		});
		canvas.addEventListener("pointerleave", () => { hoveredDial = -1; canvas.style.cursor = "default"; });
		canvas.addEventListener("click", event => {
			const rect = canvas.getBoundingClientRect();
			const x = event.clientX - rect.left;
			const y = event.clientY - rect.top;
			const idx = sites.findIndex(site => Math.hypot(x - site.x, y - site.y) <= dialRadius);
			if(idx >= 0) window.open(siteUrl(sites[idx]), "_blank", "noopener");
		});
		window.addEventListener("resize", resizeCanvas);

		document.getElementById("pageloc").textContent = `This page is hosted on: ${location.host}`;
		resizeCanvas();
		requestAnimationFrame(animate);
	</script>
</body>
</html>
